    <text x="474" y="311" font-size="12.5" fill="#9a92ad">canvas never dims the copy</text>
    <line x1="450" y1="297" x2="468" y2="297" stroke="#8b31ff" stroke-width="2"/>
  </g>
  <g class="lyr" style="animation-delay:1.05s">
    <polygon points="150,351 300,426 300,441 150,366"  fill="rgb(67,32,140)"/>
    <polygon points="300,426 450,351 450,366 300,441" fill="rgb(88,42,184)"/>
    <polygon points="300,276 450,351 300,426 150,351"   fill="#7a3aff" fill-opacity="0.9" stroke="#d9c2ff" stroke-opacity="0.35" stroke-width="1"/>
    <text x="474" y="353" font-size="17" font-weight="600" fill="#ece8f5">Fog + atmosphere arc</text>
    <text x="474" y="373" font-size="12.5" fill="#9a92ad">cold → warm across scroll</text>
