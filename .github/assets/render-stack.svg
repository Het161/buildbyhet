    <text x="474" y="229" font-size="17" font-weight="600" fill="#ece8f5">DOM chapter text</text>
    <text x="474" y="249" font-size="12.5" fill="#9a92ad">real, crawlable, ≥4.5:1</text>
    <line x1="450" y1="235" x2="468" y2="235" stroke="#9f55ff" stroke-width="2"/>
  </g>
  <g class="lyr" style="animation-delay:0.70s">
