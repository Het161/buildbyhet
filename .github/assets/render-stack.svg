<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0611"/><stop offset="1" stop-color="#06040c"/></linearGradient>
    <style>
      .lyr { animation: bob 6s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    </style>
  </defs>
  <rect width="760" height="500" fill="url(#bg)"/>
  <text x="36" y="44" font-size="15" fill="#8a8a9a" letter-spacing="1">RENDER STACK · /journey</text>
  
  <g class="lyr" style="animation-delay:0.00s">
